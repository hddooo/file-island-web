# INACTIVE release-store configuration. Install only after approved migration.
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $arg_build $asset_release {
        default current;
        "~^[a-f0-9]{40}$" releases/$arg_build;
    }
    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /srv/releases/current;
        index index.html;
        autoindex off;
        server_tokens off;
        location ^~ /api/ {
            default_type text/plain;
            add_header Cache-Control "private, no-store" always;
            return 503 "API path must be routed by NPM.\n";
        }
        location ~ (^|/)\. { return 404; }
        location = / { add_header Cache-Control "no-store" always; try_files /index.html =404; }
        location = /app-version.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
        location ~ \.html$ { add_header Cache-Control "no-store" always; try_files $uri =404; }
        location = /manifest.webmanifest {
            types { }
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            try_files $uri =404;
        }
        location = /ops { return 308 /ops/$is_args$args; }
        location = /inquiries { return 308 /inquiries/$is_args$args; }
        location ^~ /media/ {
            root /srv/releases/$asset_release;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            try_files $uri $uri/ =404;
        }
    }
}
