# Approved-member access gate. Never replace with a public fallback on verification failure.
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 map $arg_build $asset_release { default current; "~^[a-f0-9]{40}$" releases/$arg_build; }
 server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /srv/releases/current;
  index index.html;
  autoindex off;
  server_tokens off;
  add_header Cache-Control "private, no-store" always;
  auth_request /__member_check;
  error_page 401 403 = @membership_required;
  location = /__member_check {
   internal;
   auth_request off;
   proxy_method GET;
   proxy_pass https://fileisland-npm-local:443/api/v1/auth/site-check;
   proxy_pass_request_body off;
   proxy_set_header Content-Length "";
   proxy_set_header Host file-island.duckdns.org;
   proxy_set_header Cookie $http_cookie;
   proxy_ssl_server_name on;
   proxy_ssl_name file-island.duckdns.org;
   proxy_ssl_verify on;
   proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
   proxy_ssl_verify_depth 3;
   proxy_cache off;
   proxy_connect_timeout 5s;
   proxy_read_timeout 10s;
  }
  location @membership_required {
   auth_request off;
   if ($http_accept ~* "text/html") { return 302 /auth/login.html; }
   return 401;
  }
  location = /auth/login.html { auth_request off; try_files $uri =404; }
  location = /auth/login.js { auth_request off; try_files $uri =404; }
  location ^~ /auth/ { return 404; }
  location ^~ /api/ { auth_request off; default_type text/plain; return 503 "API path must be routed by NPM.\n"; }
  location ~ (^|/)\. { return 404; }
  location = / { try_files /index.html =404; }
  location = /app-version.json { auth_request off; try_files $uri =404; }
  location ~ \.html$ { try_files $uri =404; }
  location = /manifest.webmanifest { types {} default_type application/manifest+json; try_files $uri =404; }
  location = /ops { return 308 /ops/$is_args$args; }
  location = /inquiries { return 308 /inquiries/$is_args$args; }
  location ^~ /media/ { root /srv/releases/$asset_release; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }
 }
}
