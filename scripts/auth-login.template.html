<!doctype html>
<html lang="ko" data-hanq-theme="terminal"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#163b43"><title>파일섬 스터디 · 로그인</title>
<!-- Generated by scripts/build-auth-login.cjs. Only presentation assets are embedded; the member gate stays unchanged. -->
<style>
@font-face{font-family:FileIslandMenu;src:url('{{FONT}}') format('woff2');font-display:swap;font-weight:400}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:FileIslandMenu,"Apple SD Gothic Neo",sans-serif;color:#e4f6ef}body{min-height:100svh;height:100dvh;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}[hidden]{display:none!important}p{line-height:1.6}#app{z-index:1;overflow:hidden}#app::before,#app::after{content:'';position:absolute;pointer-events:none;z-index:2;top:126px;width:7px;height:102px;border-radius:6px;background:repeating-linear-gradient(0deg,#344c55 0 9px,#c7d7cf 10px 14px)}#app::before{left:-7px}#app::after{right:-7px}.device-crown{position:relative;display:flex;justify-content:center;align-items:center}.device-model{display:flex;align-items:center;gap:8px;text-align:center;font-size:14px}.device-model small{display:block;margin-top:3px;font-size:9px;color:#bdd7c6}.device-signal{display:block;width:8px;height:8px;border:1px solid #d1ebc8;border-radius:50%;background:#b9e59d;box-shadow:0 0 9px #b9e59d88}.device-shoulder{position:absolute;top:16px;width:9px;height:9px;border:1px solid #93aaa4;border-radius:50%;background:linear-gradient(135deg,#f0f4d8,#72958d)}.device-shoulder-left{left:9px}.device-shoulder-right{right:9px}.device-content{scrollbar-width:thin;scrollbar-color:#6d9b85 #0a252b;overscroll-behavior:contain}#acRoot{display:grid;gap:10px}.ac-note{color:#a5c7bb}.ac-password-row .ac-password-toggle{background:transparent;color:#b1d9c9}#message:empty{display:none}.ac-eye-slash{stroke:currentColor}.ac-form label.ac-field-label{display:grid;gap:8px}#nicknameLabel input{margin-top:8px!important}.ac-form input[type=checkbox]{width:18px;height:18px}.login-island-panorama{object-fit:contain!important;filter:drop-shadow(0 16px 30px #06323960)}
{{AUTH_CSS}}
/* Standalone gate uses the same form styling without loading protected /media. */
html body #app#app#app.login-integrated #message{font-size:13px!important;line-height:1.55;margin:4px 0;color:#ffc5b8!important;overflow-wrap:anywhere}
html body #app#app#app.login-integrated #nicknameLabel{margin-top:8px}
html body #app#app#app.login-integrated #rememberLabel{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
html body #app#app#app.login-integrated #rememberLabel[hidden]{display:none!important}
</style></head>
<body class="auth-digivice-active">
<div class="login-island-background" aria-hidden="true"><img class="login-island-panorama" src="{{BACKDROP}}" alt="" decoding="async"><i class="login-island-clouds"></i><i class="login-island-water"></i><i class="login-island-particles"></i></div>
<main class="shell login-integrated digivice-v2" id="app">
<header class="device-crown"><i class="device-shoulder device-shoulder-left" aria-hidden="true"></i><div class="device-model"><i class="device-signal" aria-hidden="true"></i><span>FILE ISLAND<small>STUDY / DIGITAL ADVENTURE</small></span></div><i class="device-shoulder device-shoulder-right" aria-hidden="true"></i></header>
<div class="device-content" role="region" aria-label="로그인 화면 · 세로 스크롤" tabindex="0"><section class="login-stage">
<div class="login-scene-copy"><span class="login-eyebrow">FILE ISLAND / STUDY</span><h2>오늘의 공부가<br>새로운 모험으로.</h2><p>함께 배우고, 함께 자라는<br>우리만의 디지털 월드</p><div class="island-friends" aria-hidden="true"><img src="{{KOROMON}}" width="124" height="124" decoding="async" alt=""><img src="{{GREYMON}}" width="124" height="124" decoding="async" alt=""></div><span class="login-world-caption">YOUR NEXT ADVENTURE STARTS HERE</span></div>
<div id="acRoot"><section class="ac-sec ac-auth-screen" aria-labelledby="authTitle"><div class="ac-auth-heading"><span class="ac-auth-kicker" id="authKicker">WELCOME BACK</span><h1 id="authTitle" style="font-size:28px;font-weight:400;margin:7px 0 8px">로그인</h1><p id="authDescription">이어서, 나만의 모험을 시작해요.</p></div>
<form id="form" class="ac-form"><label for="email">이메일</label><input id="email" type="email" maxlength="254" autocomplete="username" inputmode="email" placeholder="이메일을 입력해 주세요" required>
<label for="password">비밀번호</label><div class="ac-password-row"><input id="password" type="password" maxlength="256" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" required><button type="button" class="ac-password-toggle" id="passwordToggle" aria-label="비밀번호 표시" aria-controls="password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="ac-eye-slash" d="m4 4 16 16"/></svg></button></div>
<label id="nicknameLabel" for="nickname" hidden>닉네임<input id="nickname" maxlength="40" autocomplete="nickname" placeholder="함께할 이름을 입력해 주세요"></label>
<label id="rememberLabel" for="remember"><input id="remember" type="checkbox" aria-describedby="rememberHint" disabled>로그인 유지</label><p id="rememberHint" class="ac-note">로그인 유지 지원 여부를 확인하고 있어요.</p>
<p id="signupHint" class="ac-signup-hint" hidden>가입 요청 후 ADMIN 승인을 받으면 로그인할 수 있어요.</p>
<p id="message" role="status" aria-live="polite"></p><button id="submit" type="submit">로그인</button></form>
<div class="ac-auth-footer"><span id="toggleHint">파일섬이 처음인가요?</span><button id="toggle" type="button" class="tool-btn">가입 요청</button></div>
</section></div></section></div></main>
<script src="/auth/login.js"></script></body></html>
