name: One-time frontend status 20261111
on:
  push:
    branches: [codex/diagnose-home-502-20261111]
    paths: [.github/workflows/diagnose-home-502-20261111.yml]
permissions: {}
concurrency:
  group: home-frontend-production
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'hddooo/file-island-web' && github.actor == 'blockmonkey1992' && github.ref == 'refs/heads/codex/diagnose-home-502-20261111'
    runs-on: [self-hosted, Windows, X64, file-island-web-cd]
    timeout-minutes: 3
    steps:
      - name: Read only frontend runtime state
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference='Stop'; $d=Join-Path $env:ProgramFiles 'Docker\Docker\resources\bin\docker.exe'; if (!(Test-Path $d)) { Write-Output 'RESULT docker_cli_unavailable'; exit 1 }; $raw = & $d inspect --format '{{json .State}}' fileisland-web-candidate 2>$null; if ($LASTEXITCODE -ne 0) { Write-Output 'RESULT frontend_inspect_unavailable'; exit 1 }; $s = $raw | ConvertFrom-Json; Write-Output ('RESULT frontend_state=' + $s.Status + ' running=' + $s.Running + ' exit_code=' + $s.ExitCode + ' oom=' + $s.OOMKilled); $i = & $d inspect --format '{{.Config.Image}}' fileisland-web-candidate 2>$null; if ($LASTEXITCODE -ne 0) { Write-Output 'RESULT image_check_unavailable'; exit 1 }; Write-Output ('RESULT approved_image=' + ($i -eq 'nginx/nginx-unprivileged@sha256:74804a97de25921ce78f9e87f10ba5961eced57e2a74fd5294dfb94958436057')); Write-Output 'RESULT read_only_diagnostic_completed'"
