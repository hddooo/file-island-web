name: Recover existing frontend 20261111
on:
  push:
    branches: [codex/diagnose-home-502-20261111]
    paths: [.github/workflows/diagnose-home-502-20261111.yml]
permissions: {}
concurrency:
  group: home-frontend-production
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'hddooo/file-island-web' && github.actor == 'blockmonkey1992' && github.ref == 'refs/heads/codex/diagnose-home-502-20261111'
    runs-on: [self-hosted, Windows, X64, file-island-web-cd]
    timeout-minutes: 3
    steps:
      - name: Start only the verified existing frontend when stopped
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference='Stop'; $d=Join-Path $env:ProgramFiles 'Docker\Docker\resources\bin\docker.exe'; $n='fileisland-web-candidate'; $raw = & $d inspect --format '{{json .State}}' $n 2>$null; if ($LASTEXITCODE -ne 0) { Write-Output 'RESULT inspect_failed'; exit 1 }; $s=$raw | ConvertFrom-Json; $i = & $d inspect --format '{{.Config.Image}}' $n 2>$null; if ($LASTEXITCODE -ne 0 -or $i -ne 'nginx/nginx-unprivileged@sha256:74804a97de25921ce78f9e87f10ba5961eced57e2a74fd5294dfb94958436057') { Write-Output 'RESULT image_contract_failed'; exit 1 }; $raw = & $d inspect --format '{{json .Mounts}}' $n 2>$null; if ($LASTEXITCODE -ne 0) { Write-Output 'RESULT mount_check_failed'; exit 1 }; $mounts=$raw | ConvertFrom-Json; $m=@($mounts | Where-Object { $_.Type -eq 'volume' -and $_.Name -eq 'fileisland-web-releases' -and $_.Destination -eq '/srv/releases' -and $_.RW -eq $false }); if ($m.Count -ne 1) { Write-Output 'RESULT release_mount_contract_failed'; exit 1 }; Write-Output ('RESULT before=' + $s.Status); if ($s.Running -eq $true) { Write-Output 'RESULT already_running_no_change' } elseif ($s.Status -eq 'exited') { $null = & $d start $n 2>$null; if ($LASTEXITCODE -ne 0) { Write-Output 'RESULT start_failed'; exit 1 }; Write-Output 'RESULT existing_frontend_started' } else { Write-Output 'RESULT unexpected_state_no_change'; exit 1 }; Start-Sleep -Seconds 3; $raw = & $d inspect --format '{{json .State}}' $n 2>$null; if ($LASTEXITCODE -ne 0) { Write-Output 'RESULT readback_failed'; exit 1 }; $s=$raw | ConvertFrom-Json; Write-Output ('RESULT after=' + $s.Status + ' running=' + $s.Running); if ($s.Running -ne $true) { exit 1 }"
