name: Frontend build
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # Regression tests run locally before publication; CI builds and verifies the artifact only.
      - name: Build public runtime and checksum manifest
        run: node scripts/build-static-site.cjs
      - name: Save public runtime and checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-static-${{ github.sha }}
          path: .artifacts/site/
          if-no-files-found: error
          retention-days: 7
