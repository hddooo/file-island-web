      {id:'joseon-late',title:"조선 후기",desc:"붕당·탕평·세도 정치와 달라진 사회·경제",active:true,hidden:true,partOf:'joseon',partLabel:'후기',partAnchor:'#late-part',comic:'media/joseon-late-comic.html',summaryType:'cards',note:[{"title":"왕 흐름 ① | 전란 뒤 광해군·인조","items":["선조 때 김효원·심의겸의 이조 전랑 다툼으로 동인·서인이 갈라졌다. 정여립 사건을 빌미로 한 기축옥사도 선조 때다.","광해군은 명·후금 사이에서 중립 외교를 택했다. 강홍립이 사르후 전투에 참전했고, 기유약조로 일본과 교역을 재개했다.","광해군 때 대동법을 경기부터 시행했다. 방납의 폐단을 줄이려고 토산물 대신 쌀·동전을 거두자, 관청에 물품을 대는 공인이 등장했다.","인조반정으로 북인이 몰락했다. 인조는 이괄의 난 때 공주 공산성으로 피란했고, 전세를 1결당 4~6두로 고정한 영정법을 시행했다.","정묘호란은 정봉수·이립의 용골산성, 병자호란은 인조의 남한산성·김준룡의 광교산·항복 뒤 삼전도비로 구분한다.","병자호란 때 김상헌은 끝까지 항전하자고 했고, 최명길은 청과 화친을 주장했다. 두 인물은 같은 전쟁의 다른 입장이다."]},{"title":"왕 흐름 ② | 효종부터 숙종까지","items":["효종은 병자호란의 치욕을 갚겠다며 어영청을 중심으로 북벌을 추진했다. 신류의 조총 부대를 나선 정벌에도 보냈다.","현종 때 예송은 자의 대비의 상복 기간을 둘러싼 서인·남인의 다툼이다. 기해예송은 서인, 갑인예송은 남인이 이겼다.","숙종은 경신·기사·갑술환국으로 집권 붕당을 여러 번 바꿨다. 인현왕후 폐위·복위, 장희빈, 송시열이 함께 나오면 숙종이다.","숙종의 다른 단서: 청과 국경을 획정한 백두산정계비, 금위영 설치로 5군영 완성, 초량 왜관을 통한 일본 교역.","경종 때 목호룡의 고변으로 신임사화가 일어났다. 연잉군을 왕세제로 책봉했고, 연잉군이 뒤의 영조다."]},{"title":"왕 흐름 ③ | 탕평 뒤 세도정치","items":["영조는 붕당의 폐해를 줄이려 탕평책을 폈다. 탕평비·이인좌의 난·청계천 정비·신문고 복구가 영조의 선택지다.","영조의 균역법은 군포를 2필에서 1필로 낮춘 제도다. 모자란 재정은 결작(토지 1결당 쌀 2두)·선무군관포·어장세·선박세로 메웠다.","정조는 규장각에 서얼 검서관을 등용하고 초계문신제로 문신을 재교육했다. 장용영은 왕의 친위 부대다.","정조의 신해통공은 시전 상인의 금난전권을 없애 사상의 활동을 넓혔다. 정조 때 수원 화성을 쌓으며 정약용의 거중기를 썼다.","순조~철종에는 외척이 권력을 잡는 세도정치가 이어졌다. 순조=홍경래의 난·공노비 해방, 철종=진주 임술농민봉기·삼정이정청."]},{"title":"세금 3종 | 전세·공납·군역을 따로","items":["전세는 토지세다. 세종의 연분 9등법·전분 6등법은 풍흉·토지 질에 따라 달리 거뒀고, 인조의 영정법은 1결당 4~6두로 고정했다.","공납은 지역 특산물 부담이다. 방납이 문제 되자 광해군의 대동법은 쌀·동전으로 내게 했다. 대동법 확대와 함께 공인이 성장했다.","군역은 군포 부담이다. 영조의 균역법은 2필→1필로 줄인 대신 결작·선무군관포 등으로 재정을 보충했다.","헷갈리면 이렇게 본다: 영정법=인조·전세, 대동법=광해군·공납·공인, 균역법=영조·군역·결작."]},{"title":"경제 | 농촌·장시·화폐","items":["모내기법이 퍼지면서 벼와 보리의 이모작이 늘었다. 감자·고구마는 구황 작물, 고추·담배는 팔기 위한 상품 작물이다.","장시를 오가는 보부상, 물품을 독점해 파는 도고, 포구에서 중개하는 객주·여각을 구분한다.","사상은 민간 상인이다. 송상=개성·송방, 만상=의주, 경강상인=한강, 내상=부산 동래로 지역과 묶는다.","광산은 덕대가 경영했다. 설점수세제는 민간 채굴을 허용하고 세금을 거둔 제도다.","숙종 때 상평통보가 발행·보급되었다. 전황은 물건이 아니라 시중에 돈이 부족해지는 현상이다."]},{"title":"사회 | 신분 질서가 흔들리다","items":["서얼은 관직 진출을 위해 통청 운동을 벌였고, 정조 때 박제가·이덕무 등이 규장각 검서관에 기용되었다.","중인은 시사를 만들어 시를 지었다. 상민은 납속·공명첩을 이용해 신분 상승을 꾀했다.","순조 때 중앙 관서와 궁방의 공노비를 해방했다. 양반·상민·천민 구분이 흔들리는 조선 후기 사회 변화와 연결한다.","한글소설을 읽어주는 전기수, 판소리·탈춤·산대놀이, 민화는 서민 문화 단서다. 전기의 안견·강희안 그림과 시기를 구분한다."]},{"title":"정치 기구 | 보기 속 직책으로 찾기","items":["승정원은 왕명 출납을 맡은 왕의 비서 기관이다. 도승지·은대학사가 나오면 승정원을 고른다.","의금부는 반역죄 등을 다룬 왕 직속 사법 기관, 춘추관은 역사서 편찬·보관, 한성부는 수도 행정·치안이다.","사헌부=관리 감찰·탄핵, 사간원=왕에게 간쟁, 홍문관=경연·옥당. 셋을 묶어 삼사라 부른다.","비변사는 원래 국방 논의 기구였고 을묘왜변 뒤 상설화되었다. 세도정치기에는 외척의 권력 중심이 되었다.","지방의 유향소는 좌수·별감 중심, 경재소는 유향소 임원 임명권을 가진 기구다. 향리는 수령의 지방 실무를 돕는다."]},{"title":"실학 | 인물·책·주장 세트","items":["토지 개혁: 유형원=반계수록·균전론(신분별 차등 분배), 이익=한전론·좀론, 정약용=여전론(공동 경작·노동만큼 분배).","이용후생: 홍대용=의산문답·지전설, 박지원=열하일기(수레·선박 이용)·양반전, 박제가=북학의(청 문물 수용).","유수원의 우서는 사농공상 직업의 평등을 주장했다. 이름이 비슷한 유득공은 발해고에서 남북국 용어를 썼다.","역사·지리: 안정복 동사강목, 이중환 택리지, 정상기 동국지도(100리 척), 김정호 대동여지도(10리 눈금).","정약용은 경세유표·마과회통도 저술했고, 기기도설을 참고해 수원 화성 축조에 쓰인 거중기를 설계했다."]},{"title":"문화 | 책·사상·그림 선택지","items":["영조는 속대전·동국문헌비고, 정조는 대전통편·무예도보통지를 편찬했다. 책 이름을 왕과 한 쌍으로 외운다.","이황=성학십도·기대승과 사단칠정 논쟁, 이이=성학집요, 정제두=양명학·강화학파다.","주세붕의 백운동서원은 뒤에 사액을 받아 소수서원이 되었다. 종묘는 역대 왕·왕비의 신주가 모인 곳이다.","그림은 정선=진경산수화·금강전도·인왕제색도, 김정희=추사체·세한도·금석과안록으로 구분한다.","천주교 박해는 정조 신해박해(윤지충)와 순조 신유박해(정약용 형제·황사영 백서)를 혼동하기 쉽다. 최제우는 동학을 창시했다."]}],memory:"광해군 대동법 → 인조 호란 → 현종 예송 → 숙종 환국 → 영조 탕평·균역 → 정조 규장각·신해통공 → 세도정치·삼정 문란"},
      {id:'islands',title:"독도와 간도",desc:"영토·국경·독립운동을 잇는 핵심 단서",active:true,hidden:true,comic:'media/islands-comic.html',summaryType:'cards',note:[{"title":"먼저 시대를 놓기 | 신라·조선·개항기","items":["지증왕 때 이사부가 우산국을 복속했다. 우산국·이사부·지증왕을 한 세트로 기억한다.","숙종 때 청과의 국경을 획정하려 백두산정계비를 세웠다. 우산국 복속과는 왕도 시대도 다르다.","러일전쟁 시기 일본이 독도를 불법 편입했다. 문제에 러일전쟁·포츠머스 조약이 보이면 개항기 침탈 흐름으로 연결한다."]},{"title":"독도 | 선택지에서 왕·전쟁 구분","items":["“이사부가 우산국을 복속”은 지증왕 시기 신라의 대외 활동을 묻는 단서다.","“일본이 독도를 불법 편입”은 러일전쟁 중 일본의 침략을 묻는 단서다. 두 문장을 같은 사건으로 합치지 않는다.","러일전쟁 무렵 일본은 한일의정서를 강요했고, 뒤이어 제1차 한일협약·을사늑약으로 국권 침탈을 넓혔다."]},{"title":"북쪽 국경 | 백두산정계비","items":["청과 국경을 정한 백두산정계비는 숙종의 업적이다. 숙종의 환국·금위영·초량 왜관도 같은 왕을 찾는 단서다.","백두산정계비는 조선 후기의 국경 문제이고, 서간도·북간도는 뒤에 독립운동 기지가 된 지역이다. 시점을 나눠 기억한다."]},{"title":"간도 | 서간도와 북간도를 갈라서","items":["서간도에는 신민회 계열의 경학사와 신흥강습소가 세워졌다. 신흥강습소는 뒤에 신흥무관학교로 이어졌다.","북간도에는 이상설의 서전서숙·명동학교가 있었고, 대종교 기반의 중광단은 북로군정서로 발전했다.","문제에서 경학사·신흥무관학교면 서간도, 서전서숙·명동학교·중광단이면 북간도를 고른다."]},{"title":"간도 이후 | 독립군 전투의 순서","items":["봉오동 전투(대한독립군) → 청산리 전투(북로군정서군 등) → 간도 참변 → 자유시 참변 → 미쓰야 협정 순서다.","청산리 승리 뒤 일본군이 간도에서 보복 학살을 벌인 것이 간도 참변이다. 자유시 참변은 그 다음 단계다.","전투 이름과 지역 이름을 따로 외우지 말고, 북간도 독립군 활동이 승리와 탄압으로 이어진 흐름으로 기억한다."]}],memory:"이사부 우산국 복속 → 숙종 백두산정계비 → 러일전쟁 중 일본의 독도 불법 편입 → 서간도·북간도 독립운동 기지"},
      {id:'opening',title:"개항기와 대한제국",desc:"대원군의 개혁부터 개항·동학·국권 피탈까지",active:true,comic:'media/opening-comic.html',summaryType:'cards',note:[{"title":"흥선대원군 | 안에서는 왕권·민생 정비","items":["세도정치기의 폐단을 고치려 비변사를 없애고 군사 업무를 맡는 삼군부를 되살렸다. 서원을 대폭 철폐해 양반 세력도 누르려 했다.","호포제는 양반에게도 군포를 거둔 제도, 사창제는 환곡의 폐단을 고치려 마을에서 곡식을 관리하게 한 제도다.","경복궁 중건 비용을 마련하려 당백전을 발행했다. 대전회통은 통치 체제를 정비하기 위해 편찬한 법전이다.","호포제=군포, 사창제=환곡, 당백전=경복궁. 이름만 묻는 문제보다 “왜 했나”로 구별한다."]},{"title":"양요 | 사건을 원인→전투→결과로","items":["병인박해 뒤 프랑스군이 쳐들어온 것이 병인양요(1866)다. 양헌수는 정족산성, 한성근은 문수산성에서 싸웠고 외규장각 도서가 약탈되었다.","제너럴 셔먼호 사건과 오페르트의 남연군 묘 도굴 시도를 거쳐 신미양요(1871)가 일어났다. 어재연은 광성보에서 전사했다.","흥선대원군은 병인·신미양요 뒤 전국에 척화비를 세웠다. 양헌수·한성근은 병인, 어재연은 신미로 나눈다.","순서: 병인박해 → 제너럴 셔먼호 → 병인양요 → 오페르트 도굴 → 신미양요 → 척화비."]},{"title":"개항 조약 | 조약마다 한 단서","items":["운요호 사건을 빌미로 강화도 조약(1876)을 맺었다. 부산·원산·인천 개항과 일본의 해안 측량권을 허용한 불평등 조약이다.","조일무역규칙은 양미·잡곡의 무제한 반출과 무관세가 단서다. 개정된 통상장정에는 방곡령·관세·최혜국 대우가 들어갔다.","조미수호통상조약(1882)은 최초의 최혜국 대우·관세 자주권·거중 조정 조항이다. 뒤에 민영익 등 보빙사를 미국에 보냈다.","조청상민수륙무역장정은 청 상인의 내지 통상권, 조영통상조약은 영국인의 100리 여행, 조프통상조약은 천주교 포교 허용이다.","최혜국 대우·관세는 조미, 내지 통상권은 조청으로 먼저 구분한다. 같은 ‘조약’ 보기라도 상대국과 조항이 다르다."]},{"title":"개화 정책 | 임오군란과 갑신정변","items":["강화도 조약 뒤 통리기무아문이 개화 정책을 맡았다. 신식 군대 별기군, 일본에 조사시찰단, 청에 영선사를 보내 기술을 살폈다.","임오군란(1882)은 구식 군인의 차별 대우에서 터졌다. 흥선대원군은 청으로 끌려가고, 제물포 조약으로 일본군 주둔이 허용되었다.","임오군란 뒤 청의 영향이 커지며 조청상민수륙무역장정을 맺었다. 마젠창·묄렌도르프가 고문으로 왔다.","개화에 반대한 위정척사 세력은 이만손의 영남만인소·최익현의 왜양일체론으로 구분한다.","갑신정변(1884)은 김옥균·홍영식 등이 우정총국 개국 축하연에서 일으켰으나 청군 개입으로 3일 만에 실패했다.","갑신정변 뒤 한성조약은 조선·일본의 배상 문제, 톈진조약은 청·일 양군의 공동 철수·파병 문제다. 1885년 거문도 사건은 영국의 불법 점령이다."]},{"title":"동학농민운동 | 두 번의 봉기","items":["최제우의 동학은 교조 신원 운동으로 이어졌다. 농민은 고부 군수 조병갑의 탐학과 만석보에 맞서 고부에서 봉기했다.","전봉준이 이끄는 농민군은 황토현·황룡촌 전투에서 이기고 전주성을 점령했다. 구호는 보국안민·제폭구민이다.","전주화약 뒤 농민군은 집강소를 세워 폐정 개혁안을 실천했다. 집강소는 농민군의 자치 기구, 군국기무처는 갑오개혁 기구다.","일본군의 경복궁 점령·청일전쟁 뒤 남접·북접이 연합해 2차 봉기했다. 우금치 전투에서 패하고 전봉준이 체포되었다.","흐름: 고부 → 황토현·황룡촌 → 전주성 → 전주화약·집강소 → 2차 봉기 → 우금치."]},{"title":"갑오·을미개혁 | 개혁안을 시기별로","items":["1차 갑오개혁은 군국기무처 중심이다. 과거제·공사노비제 폐지, 과부 재가 허용, 6조→8아문이 핵심이다.","2차 갑오개혁은 홍범 14조·교육입국조서, 8도→23부, 한성사범학교 관제가 단서다.","을미사변 뒤 을미개혁은 단발령·태양력·건양 연호, 친위대·진위대 설치다. 단발령과 왕비 살해에 반발해 을미의병이 일어났다.","구분: 군국기무처=1차, 홍범 14조=2차, 단발령·태양력=을미. “개혁”이라는 말만 보고 섞지 않는다."]},{"title":"독립협회·대한제국 | 자주와 근대화","items":["서재필 등이 독립신문을 발행하고 영은문 부근에 독립문을 세웠다. 독립협회는 러시아의 절영도 조차 요구도 반대했다.","독립협회는 만민공동회·관민공동회를 열고 헌의 6조를 결의했다. 중추원 개편을 통한 의회 설립도 추진했다.","고종은 환구단에서 황제로 즉위해 대한제국(1897)을 선포했다. 광무 연호·대한국국제·원수부는 황제권 강화 단서다.","광무개혁은 구본신참을 내세워 양전사업을 실시하고 지계아문에서 토지 소유 증서인 지계를 발급했다.","황국중앙총상회는 상권 수호 단체다. 독립협회는 정치 참여·이권 반대, 대한제국은 황제권·양전·지계로 구별한다."]},{"title":"국권 피탈 | 일본의 침탈 단계","items":["러일전쟁 중 일본은 독도를 불법 편입하고 한일의정서로 군사 시설 사용권을 강요했다. 제1차 한일협약에서는 외교 고문 스티븐스·재정 고문 메가타를 두었다.","메가타의 화폐정리사업은 백동화·엽전을 일본 제일은행권으로 바꿨다. 경제 침탈 선택지에서 자주 등장한다.","을사늑약(1905)은 외교권 박탈과 통감부 설치, 초대 통감 이토 히로부미가 핵심이다.","헤이그 특사 파견을 구실로 고종을 강제 퇴위시킨 뒤 정미 7조약으로 내정권을 빼앗고 군대를 해산했다.","기유각서는 사법권 박탈, 1910년 병합은 국권 피탈의 끝이다. 외교권→내정권·군대→사법권 순서로 따라간다."]},{"title":"국권 수호 | 의병과 애국 계몽","items":["을미의병은 을미사변·단발령이 계기다. 을사의병은 을사늑약 뒤 최익현·신돌석 등이 활약했다.","군대 해산 뒤 정미의병은 13도 창의군을 꾸리고 서울 진공 작전을 시도했다. 의병의 세 단계는 계기를 붙여 외운다.","보안회는 일본의 황무지 개간권 요구를 막았고, 농광회사는 토지 침탈에 맞서 설립되었다. 대구의 국채보상운동은 나라빚을 갚자는 운동이다.","신민회는 대성·오산학교, 태극서관, 신흥강습소로 교육·출판·독립군 양성을 추진했다. 일제의 105인 사건으로 와해되었다.","안중근=하얼빈에서 이토 히로부미 처단·동양평화론, 장인환·전명운=샌프란시스코에서 스티븐스 처단이다."]},{"title":"개화기 문화 | 신문·학교·시설","items":["신문: 한성순보는 박문국이 발행한 최초의 관보, 한성주보는 상업 광고, 독립신문은 서재필의 한글·영문 신문이다.","황성신문은 장지연의 시일야방성대곡, 대한매일신보는 국채보상운동 지원과 항일 언론으로 구분한다.","학교: 원산학사는 관민 설립, 육영공원은 관립 근대 학교, 한성사범학교는 교육입국조서·2차 갑오개혁과 연결한다.","시설: 영선사 귀국 뒤 기기창(무기 공장), 알렌의 광혜원(뒤 제중원), 우정총국(갑신정변 현장)을 구분한다.","전보·전차·철도와 원각사 등은 근대 문물 단서다. 신문·학교·시설은 “누가, 언제, 무엇을 위해”를 같이 외운다."]}],memory:"흥선대원군 개혁·양요 → 강화도 조약 → 임오군란 → 갑신정변 → 동학농민운동·갑오개혁 → 대한제국 → 을사늑약 → 국권 피탈"},
      {id:'colonial',title:"일제 강점기와 독립운동",desc:"통치 방식의 변화와 국내외 독립운동",active:true,comic:'media/colonial-comic.html',summaryType:'cards',note:[{"title":"통치 ① | 1910년대 무단 통치","items":["조선총독부가 식민 통치를 맡았다. 헌병경찰이 일반 경찰 업무까지 맡고, 조선인에게만 태형령을 적용했다.","회사령은 회사 설립을 허가제로 만든 법이다. 토지조사사업은 정해진 기한 안에 토지를 신고하게 해 소유권을 조사했다.","1910년대 보기에서 헌병경찰·태형령·회사령·토지조사사업이 보이면 같은 시기로 묶는다.","경복궁에서 열린 조선물산공진회도 1910년대 단서다. 뒤의 조선 물산 장려 운동과 이름을 혼동하지 않는다."]},{"title":"통치 ② | 3·1 운동 뒤 1920년대","items":["윌슨의 민족 자결주의·도쿄 2·8 독립선언이 배경이 되고, 고종의 인산일을 계기로 3·1 운동이 전국으로 퍼졌다.","일제는 제암리 학살을 저질렀다. 3·1 운동은 대한민국 임시정부 수립과 이른바 문화 통치로의 전환에 영향을 주었다.","문화 통치는 헌병경찰→보통경찰, 신문 발행 허용이 겉모습이다. 경찰 병력·예산은 오히려 늘고 언론은 검열했다.","치안유지법(1925)은 사회주의자 통제뿐 아니라 민족 운동 탄압에도 쓰였다. 보통경찰·신문 검열·치안유지법은 1920년대 단서다.","산미증식계획은 일본의 쌀 부족을 메우려 추진했다. 생산 증가보다 수탈이 커져 조선의 식량난과 소작쟁의가 심해졌다."]},{"title":"통치 ③ | 1930년대 중반 이후 전시 동원","items":["전쟁이 확대되자 일제는 남면북양 정책, 국가총동원법으로 사람과 물자를 전쟁에 동원했다.","황국신민서사 암송·창씨개명·내선일체는 민족말살 정책, 애국반은 일상생활 감시의 단서다.","국민징용령·학도 지원병·여자 정신 근로령은 강제 동원을 가리킨다. 몸뻬·국방헌금도 같은 전시 시기다.","연대 구별: 1910년대 태형령·회사령 → 1920년대 보통경찰·산미증식 → 일제 말 창씨개명·국가총동원법."]},{"title":"임시정부 | 3·1 운동의 다음 장면","items":["3·1 운동 뒤 상하이에서 대한민국 임시정부가 수립되었다. 연통제는 국내 비밀 행정 조직, 교통국은 국내 연락망이다.","독립 공채는 활동 자금, 구미 위원부는 미국에서의 외교 활동, 파리 강화 회의 독립 청원은 국제 여론에 호소한 사례다.","외교·연락이 막히자 국민대표회의에서 독립운동 방략을 논의했다. 창조파·개조파가 대립했다.","1930년대 한인애국단, 1940년대 한국광복군으로 무장 투쟁을 이어갔다. 건국 강령은 조소앙의 삼균주의를 바탕으로 했다.","연통제·교통국·독립 공채·국민대표회의가 한 문제에 섞여 나오면 임시정부로 묶는다."]},{"title":"1920년대 민족 운동 | 학교·물건·연대","items":["물산장려운동은 평양의 조선 물산 장려회·조만식이 중심이었다. “조선 사람 조선 것”이라는 구호를 썼다.","민립대학 설립 운동은 조선 민립 대학 기성회가 모금했으나 경성제국대학 설립 등으로 무산되었다.","6·10 만세운동은 순종의 인산일을 계기로 일어나 민족 유일당 운동을 자극했다. 정우회 선언 뒤 신간회가 결성되었다.","신간회는 광주학생항일운동에 진상 조사단을 보냈다. 근우회는 좌우 협동 전선의 여성 단체다.","광주학생항일운동은 한일 학생 충돌에서 시작해 성진회·독서회가 전국 시위로 확산시켰다."]},{"title":"농민·노동·사회 | 장소와 사건 연결","items":["암태도 소작쟁의는 전남 신안군에서 높은 소작료에 맞선 농민 운동이다. 진주의 조선 형평사는 백정 차별 철폐를 요구했다.","조선 노농 총동맹은 농민·노동을 묶었다가 각 총동맹으로 갈라졌다. 원산 총파업은 최대 규모의 노동 운동으로 신간회도 지원했다.","강주룡은 평양 을밀대 지붕에서 고공 농성을 벌였다. 단서가 “을밀대”면 노동 운동 인물을 찾는다.","방정환은 어린이날·소년 운동, 동아일보의 브나로드 운동은 농촌 계몽·문맹 퇴치와 묶는다."]},{"title":"1910년대 독립운동 | 국내 결사와 해외 기지","items":["독립의군부=임병찬·고종 밀지·복벽주의·국권 반환 요구서, 대한광복회=박상진·공화주의·상덕태상회·친일파 처단.","서간도=경학사·신흥강습소(뒤 신흥무관학교), 북간도=서전서숙·명동학교·중광단(뒤 북로군정서).","연해주=신한촌·권업회, 상하이=동제사·신한청년당, 미국=대한인국민회·흥사단으로 지역을 갈라 외운다.","일본 도쿄의 2·8 독립선언과 미국 윌슨의 민족 자결주의는 3·1 운동의 배경 단서다."]},{"title":"1920년대 무장투쟁 | 의열단과 전투 순서","items":["의열단은 김원봉이 조직했고 신채호의 조선혁명선언을 지침으로 삼았다. 일제 기관 파괴·매국노 처단을 추구했다.","김상옥=종로경찰서, 김익상=조선총독부, 나석주=동양척식주식회사 폭탄 의거로 장소를 붙인다.","봉오동 전투는 홍범도의 대한독립군, 청산리 전투는 김좌진의 북로군정서군 등이 핵심이다.","순서는 봉오동 → 청산리 → 간도 참변 → 자유시 참변 → 미쓰야 협정. 승리 뒤 탄압과 독립군의 시련이 이어졌다."]},{"title":"1930~40년대 무장투쟁 | 부대 이름 구분","items":["한국독립군=지청천·북만주·쌍성보/대전자령 전투, 조선혁명군=양세봉·남만주·영릉가/흥경성 전투다.","김구의 한인애국단은 이봉창(도쿄 일왕 마차)·윤봉길(상하이 홍커우 공원) 의거와 묶는다.","조선의용대는 김원봉이 1938년 우한에서 조직한 중국 관내 첫 한인 무장 부대다.","한국광복군은 1940년 충칭에서 임시정부 산하로 조직됐다. 지청천이 총사령관이며 미국 OSS와 국내 진공 작전을 준비했다.","“북만주 지청천”은 한국독립군, “충칭 지청천”은 한국광복군이다. 인물은 같아도 시기·부대가 다르다."]},{"title":"문화·일상 | 책·언어·영화를 단서로","items":["신채호=독사신론·조선상고사(아와 비아), 박은식=한국통사·한국독립운동지혈사, 백남운=조선사회경제사다.","조선어학회는 한글맞춤법 통일안과 우리말 큰 사전 편찬을 추진했다. 일제의 조선어학회 사건으로 탄압받았다.","천도교=만세보·개벽·방정환, 대종교=나철·단군 신앙·중광단, 원불교=박중빈·새생활 운동으로 묶는다. 천주교의 의민단도 무장 투쟁 단서다.","나운규의 영화 아리랑, 심훈의 상록수, 윤동주의 별 헤는 밤도 작품명으로 인물을 맞히는 단서다.","일상 선택지: 미쓰코시 백화점·단성사·라디오·신여성·모던 걸/보이·끽다점은 일제 강점기 풍경이다."]}],memory:"1910년대 무단 통치 → 3·1 운동·임시정부 → 1920년대 문화 통치·봉오동·청산리 → 1930년대 만주·의열 투쟁 → 전시 동원·광복군"},
      {id:'modern',title:"광복과 대한민국",desc:"정부 수립·전쟁·민주화·남북 관계",active:true,comic:'media/modern-comic.html',summaryType:'cards',note:[{"title":"광복 뒤 | 통일정부를 향한 시도","items":["여운형은 조선건국동맹을 바탕으로 조선건국준비위원회를 만들었다. 광복 직후 건준은 조선 인민 공화국을 선포했다.","모스크바 3국 외상회의 뒤 신탁통치를 둘러싸고 대립했다. 미소공동위원회는 협의에 실패했고, 이승만은 정읍에서 남한 단독 정부를 주장했다.","여운형·김규식의 좌우합작위원회는 좌우합작 7원칙을 발표했다. 김구·김규식은 남북 협상에도 참여했다.","순서: 광복 → 모스크바 회의 → 정읍 발언·좌우합작 → 유엔 결정 → 남북 협상 → 5·10 총선거.","제주 4·3 사건은 단독 선거 반대와 진압 과정의 충돌이다. 여수·순천 10·19 사건과도 연결된다."]},{"title":"정부 수립 | 제헌국회의 두 과제","items":["5·10 총선거는 우리나라 최초의 보통선거로 제헌국회의원을 뽑았다. 제헌헌법 제정 뒤 1948년 대한민국 정부가 수립됐다.","제헌국회는 반민족 행위 처벌법을 만들어 반민특위를 설치했다. 친일 청산은 방해를 받아 반민특위가 해체되었다.","농지개혁법은 유상 매수·유상 분배가 원칙이다. 정부가 땅을 사들여 농민에게 나누는 방식이라는 뜻이다.","미군정의 신한공사는 일본인 소유 재산을 넘겨받았다. 농지개혁·반민특위와 이름이 비슷해도 역할은 다르다."]},{"title":"6·25 전쟁 | 순서와 전후 사건","items":["애치슨 선언 뒤 북한의 남침으로 6·25 전쟁이 시작됐다. 부산 임시 수도 → 인천 상륙 작전 → 압록강 진출이 전반부다.","중국군 참전 뒤 흥남 철수·서울 재함락을 겪었다. 전선이 교착된 끝에 1953년 정전 협정을 맺고 한미상호방위조약이 이어졌다.","전쟁 중 부산 비상계엄 아래 발췌개헌이 통과되어 대통령 직선제로 바뀌었다. 전쟁 뒤의 사사오입개헌은 초대 대통령 중임 제한 철폐다.","이승만 정부의 농지개혁·삼백 산업(밀가루·설탕·면직물), 진보당 사건(조봉암), 경향신문 폐간을 함께 묶는다.","전쟁 순서 문제에서는 “인천 상륙”이 “중국군 참전·흥남 철수”보다 먼저다."]},{"title":"민주화 ① | 4·19 혁명","items":["이승만 정부의 3·15 부정선거에 반발해 시위가 일어났다. 마산에서 김주열의 죽음이 알려지며 4·19 혁명이 확산했다.","결과는 이승만 하야 → 허정 과도정부 → 의원내각제의 장면 내각이다. 국회는 민의원·참의원의 양원제로 바뀌었다.","4·19는 부정선거와 대통령 하야, 5·18은 광주 시민군, 6월 민주항쟁은 대통령 직선제 회복으로 결과를 구별한다."]},{"title":"박정희 정부 | 산업화와 유신","items":["5·16 군사정변 뒤 국가재건최고회의가 군정을 맡았고, 이후 박정희 정부는 경제개발 5개년 계획을 추진했다.","경부고속도로·포항제철·새마을운동·서울 지하철 1호선은 경제·사회 변화의 대표 단서다. 1·21 사태 뒤 향토예비군이 창설됐다.","한일 국교 정상화에 반대한 것이 6·3 시위다. 1972년 유신헌법은 통일주체국민회의의 간접선거·긴급조치권이 핵심이다.","3선 개헌 반대, 개헌 청원 100만인 서명, 3·1 민주 구국 선언은 유신과 장기 집권에 대한 저항이다.","YH 무역 사건 → 김영삼 의원직 제명 → 부마항쟁 → 10·26 사태로 이어지는 말기 흐름도 기억한다."]},{"title":"전두환 정부 | 5·18과 1987년","items":["5·18 민주화운동은 광주에서 계엄 확대에 반발하며 일어났다. 시민군이 계엄군에 맞선 것이 핵심 단서다.","전두환 정부의 8차 개헌은 대통령 선거인단이 뽑는 간접선거·7년 단임이다. 보도지침·삼청교육대·야간통행금지 해제도 같은 시기다.","1987년 박종철 고문치사·4·13 호헌조치·이한열 희생으로 6월 민주항쟁이 커졌다.","6·29 민주화 선언 뒤 9차 개헌으로 대통령 직선제·5년 단임제가 확립됐다. 8차의 간선·7년과 반대로 외운다.","경제 보기의 저유가·저금리·저달러 ‘3저 호황’과 최저임금법도 전두환 정부 단서다."]},{"title":"1988년 이후 | 정부별 대표 선택지","items":["노태우=서울올림픽·3당 합당·7·7 선언·남북 UN 동시가입·남북기본합의서.","김영삼=문민정부·금융실명제·하나회 해체·지방자치제 전면 실시·민주노총 창립. 임기 말 외환위기가 닥쳤다.","김대중=외환위기 극복의 금 모으기·국민기초생활보장법·첫 남북 정상회담·6·15 공동선언.","노무현=호주제 폐지·한미 FTA 체결·개성공단 착공·10·4 남북 정상 선언.","문재인=평창 동계올림픽 남북 공동입장·판문점 남북 정상회담. 이름보다 사건을 정부에 붙여 기억한다."]},{"title":"남북 관계 | 선언 이름으로 정부 찾기","items":["박정희의 7·4 남북 공동 성명은 자주·평화·민족대단결의 3대 원칙과 남북조절위원회가 단서다.","전두환 때는 남북 이산가족 고향 방문단 교환이 처음 실현됐다.","노태우=7·7 선언·북방 외교·남북고위급회담·UN 동시가입·남북기본합의서·한반도 비핵화 공동선언.","김대중=금강산 해로 관광·6·15 공동선언·개성 공업지구 조성 합의, 노무현=개성공단 착공·10·4 선언이다.","문재인=판문점 정상회담·평창 공동입장. 7·4 / 6·15 / 10·4는 각각 박정희 / 김대중 / 노무현으로 짝짓는다."]},{"title":"헷갈리는 민주화 사건 | 원인과 결과","items":["4·19 혁명: 3·15 부정선거 → 김주열 → 이승만 하야·장면 내각.","6·3 시위: 한일 국교 정상화 반대. 부마항쟁: YH 무역 사건·김영삼 제명 뒤 부산·마산의 유신 반대.","5·18 민주화운동: 광주·계엄 확대 반대·시민군. 6월 민주항쟁: 4·13 호헌조치 반대 → 6·29 선언·직선제.","시험에서 “시민군”과 “직선제”가 보이면 각각 5·18과 6월 민주항쟁으로 바로 나눈다."]}],memory:"광복 → 5·10 총선거·정부 수립 → 6·25 → 4·19 → 5·16·유신 → 5·18 → 6월 민주항쟁 → 직선제 → 남북 교류"}

    var app=document.getElementById('app'),current=null,step=0,chapterPart='all';
    app.addEventListener('click',function(event){var recovery=window.HanqAuthSession,target=event.target.closest('a[href="#account"],#feLogin,[data-notebook-login]');if(recovery&&target&&recovery.protectedRoute(location.hash))recovery.remember(location.hash);},true);

      if(replaySavedNavigation||!target||target.matches('.gsr-modes [data-mode],.jsr-modes [data-mode]')||!library||!library.hasUnsaved||!library.hasUnsaved())return;
      var parentAction=target._hanqParentBack,parentControl=typeof target._hanqParentControl==='function'?target._hanqParentControl():null;
      event.preventDefault();event.stopImmediatePropagation();library.prepareLeave().then(function(){if(!target.isConnected)return;if(parentAction&&(target._hanqParentBack!==parentAction||typeof target._hanqParentControl!=='function'||target._hanqParentControl()!==parentControl))return;replaySavedNavigation=true;try{target.click();}finally{replaySavedNavigation=false;}},function(){});

    app.addEventListener('click',function(event){var ig=event.target.closest('[data-islands-go]');if(ig){openChapter(ig.getAttribute('data-islands-go'),false,0);window.scrollTo(0,0);return;}var subject=event.target.closest('[data-subject]');if(subject){if(subject.dataset.subject==='toeic')openToeic();else home();return;}if(event.target.closest('.device-home')){openSubjectMenu();return;}if(event.target.closest('#homeBrand')){var headerBack=event.target.closest('#homeBrand');if(headerBack.disabled)return;if(typeof headerBack._hanqParentBack==='function'){headerBack._hanqParentBack();return;}var map=islandMapTarget();if(map==='toeic')openToeic(false,'map');else if(map==='history')home();else openSubjectMenu();}else if(event.target.closest('#headerAccount'))openAccount('main');else{var lo=event.target.closest('#headerLogout');if(lo&&!lo.disabled&&window.HanqAccountUI&&HanqAccountUI.logout){lo.disabled=true;lo.setAttribute('aria-busy','true');HanqAccountUI.logout().then(function(){if(!app.querySelector('#allReviewHost'))openAccount('main');});}}});
    var stepSlugs=['webtoon','summary','quiz','mock','review','culture','bookquiz','exam-lines','source-quiz','blank-test'];
    function chapterById(id){return chapters.find(function(c){return c.id===id&&c.active;})||null;}
    /* 통합 장(조선시대)이면 지금 고른 범위의 원래 장들, 아니면 현재 장 하나 */
    function partChapters(){if(!current)return [];if(!current.parts)return [current];return current.parts.filter(function(id){return chapterPart==='all'||chapterPart===id;}).map(chapterById).filter(Boolean);}
    function routeId(){return current?(current.parts&&chapterPart!=='all'?chapterPart:current.id):null;}
    function routeUrl(){return current?'#chapter/'+encodeURIComponent(routeId())+'/'+stepSlugs[step]:'#history';}
    function saveRoute(replace){var prior=history.state&&history.state.hanq?history.state.depth:0;var state={hanq:true,chapterId:routeId(),step:step,depth:replace?prior:prior+1};history[replace?'replaceState':'pushState'](state,'',routeUrl());}

    /* 화면 갱신은 모두 잠금 창구(RCS)를 거친다: 최신 회차를 잠금 안에서 읽고(마감이 지났으면 그 안에서 채점), 기다리는 동안은 버튼을 끄며,

    var rcTok=0;

    function rcRefresh(focusSel){if(!RCS||!rcOpenId)return;var id=rcOpenId,tok=++rcTok;rcSetPending();

    function rcDo(p,focusSel){var id=rcOpenId,tok=++rcTok;rcSetPending();
      return Promise.resolve(p).then(function(res){if(tok!==rcTok||!rcOnRoute(id))return;var run=res&&res.run;if(!run&&res&&res.reason==='no-lock')run=RC.peek(id);
        if(run&&run.status==='final')focusSel='#rcResultTitle';rcPaint(id,run,focusSel);},function(){if(tok===rcTok&&rcOnRoute(id))rcRefresh(focusSel);});}
    function rcPaint(id,run,focusSel){rcStopTimer();
      if(!run){app.innerHTML=rcShell('모의고사','<section class="panel rc-run rc-missing" data-status="missing" data-run="'+escapeHTML(id)+'"><p>이 모의고사를 찾지 못했어요. 이 브라우저에 저장된 올바른 회차만 열 수 있어요.</p><button type="button" class="check-one" id="rcToNotes">나만의 오답노트로</button></section>');rcBindShell();app.querySelector('#rcToNotes').addEventListener('click',function(){openWrongNotes();});return;}
      if(run.status!=='active')rcConfirm=false;
      var ro=!RCS.crossTabSafe,lockNote=ro?'<p class="hp-notice" role="status">이 브라우저는 여러 탭이 같은 모의고사를 안전하게 나눠 쓰는 기능(Web Locks)이 없어, 답을 저장하거나 채점할 수 없어요. 다른 최신 브라우저에서 열어 주세요. 저장된 내용은 그대로 두었어요.</p>':'';
      app.innerHTML=rcShell(run.title,lockNote+rcNotice()+(run.status==='ready'?rcReadyHtml(run):run.status==='active'?rcActiveHtml(run):rcResultHtml(run)));rcBindShell();
      var sec0=app.querySelector('.rc-run');if(sec0)sec0.setAttribute('data-run',id);
      var $=function(s){return app.querySelector(s);};
      if(run.status==='ready')$('#rcStart').addEventListener('click',function(){rcDo(RCS.start(id),'.rc-choice');});
      if(run.status==='active'){
        var r0=$('#rcResume');if(r0)r0.addEventListener('click',function(){rcDo(RCS.resume(id),'#rcPause');});
        var pz=$('#rcPause');if(pz)pz.addEventListener('click',function(){rcDo(RCS.pause(id),'#rcResume');});
        var sb=$('#rcSubmit');if(sb)sb.addEventListener('click',function(){rcConfirm=true;rcRefresh('#rcConfirmNo');});
        var cy=$('#rcConfirmYes');if(cy)cy.addEventListener('click',function(){rcConfirm=false;rcDo(RCS.submit(id),'#rcResultTitle');});
        var cn=$('#rcConfirmNo');if(cn)cn.addEventListener('click',function(){rcConfirm=false;rcRefresh('#rcSubmit');});
        var go=function(n,sel){rcDo(RCS.go(id,n),sel);};
        var jp=$('#rcJump');if(jp)jp.addEventListener('change',function(){go(Number(jp.value),'#rcJump');});
        if($('#rcPrev'))$('#rcPrev').addEventListener('click',function(){go(run.current-1,run.current-1>0?'#rcPrev':'#rcNext');});
        if($('#rcNext'))$('#rcNext').addEventListener('click',function(){go(run.current+1,run.current+1<run.items.length-1?'#rcNext':'#rcPrev');});

      if(window.HanqAccountUI)HanqAccountUI.render(rootEl,{view:view,afterLogin:finishLoginLanding,go:function(v){if(v==='home')home();else if(v==='notes')openWrongNotes();else openAccount(v);},firstLesson:function(){openChapter('prehistory',false,0);},summaryTargets:studySummaryTargets,goSummary:studyGoSummary,eraTitle:function(id){try{return eraTitle(id);}catch(err){return '';}},local:{attempts:function(){return HPS?HPS.attempts({subject:'history'}):[];}}});
      else rootEl.innerHTML='<p class="hp-notice" role="status">계정 화면을 불러오지 못했어요. 새로 고쳐 주세요. 이 기기의 기록은 그대로예요.</p>';
      if(!HanqApi.state().signedIn){app.classList.add('login-landing','login-integrated');app.querySelector('.module-head h1').textContent='파일섬 스터디';var welcome=document.createElement('section');welcome.className='file-island-welcome login-stage';welcome.innerHTML='<div class="login-scene-copy"><h2>오늘의 공부도 함께</h2><p>파일섬 스터디 월드에 오신 것을 환영합니다!</p></div><div class="island-friends"><img src="media/characters/koromon-scene.webp" width="124" height="124" decoding="async" alt="코로몬"><img src="media/characters/greymon-scene.webp" width="124" height="124" decoding="async" alt="그레이몬"></div>';welcome.querySelectorAll('.island-friends img').forEach(function(image,index){image.addEventListener('error',function(){image.src='media/characters/'+(index===0?'koromon':'greymon')+'.png';},{once:true});});app.querySelector('#acRoot').before(welcome);welcome.appendChild(rootEl);app.querySelectorAll('.subject-switch,.module-actions,.mobile-nav').forEach(function(n){n.hidden=true;});}else app.classList.remove('login-landing','login-integrated');
      window.scrollTo({top:0,behavior:'smooth'});var h=app.querySelector('.module-head h1');if(h&&!silent){try{h.focus({preventScroll:true});}catch(err){}}}
    /* 서버 연결이 켜져 있을 때만: 전에 로그인했던 브라우저면 세션을 조용히 되살리고, 목차의 계정 버튼·오답노트 안내 글을 맞춘다 */
    document.addEventListener('hanq:premium-expired',function(){refreshHeader();if(current&&(step===2||step===3))renderLesson();});
    document.addEventListener('hanq:character-change',function(){refreshHeader();});
    if(window.HanqAuthSession)HanqAuthSession.configure({requireLogin:function(){if(!/^#account(?:\/|$)/.test(location.hash))openAccount('main');},navigate:function(hash){if(!HanqAuthSession.safeReturnTo(hash))return;history.replaceState(null,'',location.pathname+location.search+hash);window.dispatchEvent(new PopStateEvent('popstate',{state:null}));}});
    var choiceDraftOwner=null,choiceDraftOff=[];
    if(window.HanqApi&&window.HanqAuthSession)HanqApi.onChange(function(st){
      var owner=st.signedIn&&st.ownerId||null;if(owner===choiceDraftOwner)return;
      choiceDraftOff.forEach(function(off){off();});choiceDraftOff=[];choiceDraftOwner=owner;
      if(owner)['quiz','mock'].forEach(function(kind){choiceDraftOff.push(HanqAuthSession.register('history-'+kind,{ownerId:owner,capture:function(){return captureChoiceDraft(kind,owner);}}));});
    });
    var memberFingerprint='';if(window.HanqApi&&HanqApi.enabled()){HanqApi.onChange(function(st){if(!st.signedIn&&!st.restoring){if(!/^#account(?:\/|$)/.test(location.hash))requireStudyLogin();}else if(st.signedIn&&!st.restoring&&loginLanding){finishLoginLanding();}var fp=String(st.ownerId)+'|'+st.epoch+'|'+!!st.restoring+'|'+memberPremiumActive(st)+'|'+JSON.stringify(st.access&&st.access.freeSlots);if(memberFingerprint!==fp){memberFingerprint=fp;quizObservedOwner=st.ownerId;if(current&&(step===2||step===3))renderLesson();}refreshHeader(st);var s=app.querySelector('#homeAccountSub');if(s)s.textContent=st.restoring?'로그인 복원 중…':st.signedIn&&st.user?(st.user.displayName||'')+' · 프로필 · 프리미엄':'로그인 · 회원가입 · 프리미엄';});
      if(window.HanqAccountSync)HanqAccountSync.start(); // 로그인·쿠키 복원 때 이 계정으로 푼 이 기기 기록만 서버로(마이페이지 밖에서도)
      HanqApi.init().then(function(){refreshHeader();if(wnOpen&&!wnRun&&app.querySelector('.wn-panel'))renderWrongNotes();},function(){refreshHeader();});}

    restoreQuiz(false);restoreMock(false);restoreRun();
    /* 뒤에 붙일 시간제 모의고사·오답 모의(다음 단계)와 시험용 읽기 전용 고리 */
    window.HanqMyPage={open:function(){openWrongNotes();},notes:function(){return wnNotes();},run:function(){return wnRun?JSON.parse(JSON.stringify(wnRun)):null;},staleDrafts:function(){return staleDrafts;}};

    function renderInitialStudyRoute(){
    if(!(window.HanqApi&&HanqApi.state().signedIn)){requireStudyLogin();return;}
    var initialRoute=readRoute(),initialFormal=location.hash.match(/^#formal-exams(?:\/((?:review-)?[0-9a-f-]{36}))?$/);var initialReview=reviewHashRoute();var initialAppendix=location.hash.match(/^#textbook\/(people|regions|front|credits)$/);if(initialAppendix){openTextbookAppendix(initialAppendix[1],true);}else if(!location.hash||location.hash==='#subjects'){openSubjectMenu(true);}else if(/^#toeic-cbt(?:\/|$)/.test(location.hash)){openToeicCbt(true,location.hash.split('/')[1]||null);}else if(/^#toeic(?:\/|$)/.test(location.hash)){openToeic(true,location.hash.split('/')[1],location.hash.split('/')[2],location.hash.split('/').slice(3).join('/'));}else if(/^#battle(?:\/|$)/.test(location.hash)){openBattle(true,location.hash.split('/').slice(1).join('/'));}else if(location.hash==='#rainbow'){openRainbow(true);}else if(location.hash==='#hall-of-fame'){openHall(true);}else if(location.hash==='#history'){home(true);}else if(initialReview){openReviews(true,initialReview[1],initialReview[2]);}else if(initialFormal){openFormalExams(true,initialFormal[1]);}else if(location.hash==='#past-exams'){openEraMenu(true);}else if(initialRoute){openChapter(initialRoute.id,true,initialRoute.step);if(initialRoute.step!==4)saveRoute(true);}else if(location.hash==='#wrongnotes'){openWrongNotes(true);history.replaceState({hanq:true,view:'wrongnotes',depth:0},'',location.pathname+location.search+'#wrongnotes');}else if(/^#account(\/|$)/.test(location.hash)){var av=/^run\//.test(location.hash.slice(9))?'notes':acNorm(location.hash.slice(9));openAccount(av,true);history.replaceState({hanq:true,view:'account',sub:av,depth:0},'',location.pathname+location.search+acHash(av));}else if(location.hash==='#exams'){openLegacyToNotes();}else if(/^#run\/r[0-9a-z]{6,40}$/.test(location.hash)){var rid=location.hash.slice(5);openRun(rid,true);if(rcOpenId===rid)history.replaceState({hanq:true,view:'run',runId:rid,depth:0},'',location.pathname+location.search+'#run/'+rid);}else{openSubjectMenu(true);}
    }
    // A known session is still being restored here. Keep its route until the
    // existing API client confirms it; do not turn a reload into a fresh login.
    var bootHash=location.hash;
    if(window.HanqApi&&HanqApi.state().restoring){
      app.innerHTML=header()+'<p class="hp-notice" role="status">로그인 상태를 확인하고 있어요…</p>';
      HanqApi.init().then(function(){if(location.hash===bootHash)renderInitialStudyRoute();});
    }else renderInitialStudyRoute();
  })();
  </script>
