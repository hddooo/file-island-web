<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>파일섬 · 로그인</title>
<style>[hidden]{display:none!important}body{margin:0;background:#f7f5f0;color:#18212f;font:16px/1.6 system-ui,sans-serif}main{max-width:390px;margin:9vh auto;padding:28px;background:white;border:1px solid #ddd;border-radius:18px}h1{margin:0 0 8px}label{display:block;margin-top:14px}input:not([type=checkbox]){box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:8px;font:inherit}button{margin-top:18px;padding:12px 18px;font:inherit;cursor:pointer;border-radius:8px;border:1px solid #294d87;background:#294d87;color:white}button.secondary{background:white;color:#294d87}#message{min-height:3em}small{color:#647083}</style>
</head><body><main><h1>파일섬</h1><p>승인된 회원만 이용할 수 있어요.</p><form id="form"><label>이메일<input id="email" type="email" maxlength="254" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" maxlength="256" autocomplete="current-password" required></label><label id="nicknameLabel" hidden>닉네임<input id="nickname" maxlength="40" autocomplete="nickname"></label><label id="rememberLabel"><input id="remember" type="checkbox"> 로그인 유지</label><button id="submit" type="submit">로그인</button> <button id="toggle" type="button" class="secondary">가입 요청</button></form><p id="message" role="status" aria-live="polite"></p><small>새 가입은 ADMIN 승인 후 이용할 수 있습니다.</small></main><script src="/auth/login.js"></script></body></html>
